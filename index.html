<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirect</title>

    <script>
      const target = new URLSearchParams(location.search).get('url')

      if (target) {
        location.replace(target)
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
