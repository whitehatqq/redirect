<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirect</title>

    <script>
      const repoName = 'redirect'

      const redirects = {
        nic_16_06: 'https://vpnon.ru/ru/home?source=nic_17_06_26#widget_main',
        sdkflkdlf: 'https://google.com',
      }

      let parts = location.pathname.split('/').filter(Boolean)

      if (parts[0] === repoName) {
        parts.shift()
      }

      const code = parts[0]
      const target = redirects[code] || 'https://google.com'

      location.replace(target)
    </script>
  </head>

  <body>
    <p>Redirecting...</p>
  </body>
</html>
